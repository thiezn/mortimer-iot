<VirtualHost *:80>
        # The ServerName directive sets the request scheme, hostname and port that
        # the server uses to identify itself. This is used when creating
        # redirection URLs. In the context of virtual hosts, the ServerName
        # specifies what hostname must appear in the request's Host: header to
        # match this virtual host. For the default virtual host (this file) this
        # value is not decisive as it is used as a last resort host regardless.
        # However, you must set it for any further virtual host explicitly.
        ServerName pap.mortimer.nl
        ServerAlias pap.mortimer.nl

        ServerAdmin admin@mortimer.nl
        DocumentRoot /var/www/pap.mortimer.nl
        <Directory "/var/www/pap.mortimer.nl">
            Options FollowSymLinks
            AllowOverride All
        </Directory>
RewriteEngine on
RewriteCond %{SERVER_NAME} =pap.mortimer.nl [OR]
RewriteCond %{SERVER_NAME} =pap.mortimer.nl
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost _default_:443>
    ServerName  pap.mortimer.nl
    ServerAlias pap.mortimer.nl
    ServerAdmin admin@mortimer.nl
    DocumentRoot /var/www/pap.mortimer.nl


    <Directory "/var/www/pap.mortimer.nl">
      Options FollowSymLinks
      AllowOverride All
    </Directory>
        Include    /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/pap.mortimer.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/pap.mortimer.nl/privkey.pem
</VirtualHost>
</IfModule>

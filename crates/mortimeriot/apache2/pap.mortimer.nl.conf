<VirtualHost *:80>
    ServerName pap.mortimer.nl
    ServerAlias pap.mortimer.nl

    ServerAdmin admin@mortimer.nl
    DocumentRoot /var/www/pap.mortimer.nl/current

    <Directory "/var/www/pap.mortimer.nl/current">
      Options FollowSymLinks
      AllowOverride None
      Require all granted
    </Directory>

RewriteEngine on
RewriteCond %{SERVER_NAME} =pap.mortimer.nl [OR]
RewriteCond %{SERVER_NAME} =pap.mortimer.nl
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost _default_:443>
    ServerName  pap.mortimer.nl
    ServerAlias pap.mortimer.nl
    ServerAdmin admin@mortimer.nl
    DocumentRoot /var/www/pap.mortimer.nl/current

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:2111/api
    ProxyPassReverse /api http://127.0.0.1:2111/api
    ProxyPass /iot http://127.0.0.1:2111/iot
    ProxyPassReverse /iot http://127.0.0.1:2111/iot

    <Directory "/var/www/pap.mortimer.nl/current">
      Options FollowSymLinks
      AllowOverride None
      Require all granted
    </Directory>

    Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/mortimer.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/mortimer.nl/privkey.pem
</VirtualHost>
</IfModule>
